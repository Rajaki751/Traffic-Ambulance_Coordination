name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend CI (FastAPI, Python, Pytest)
  # ==========================================
  backend-ci:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Python Linters & Syntax Check
        working-directory: ./backend
        run: |
          python -m compileall app tests

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          SECRET_KEY: "ci-secret-key-for-testing-only"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          CORS_ORIGINS: "http://localhost:5173"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml -v

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ==========================================
  # 2. Dashboard CI (React, Vite, Vitest)
  # ==========================================
  dashboard-ci:
    name: Dashboard (Node 20.x, Lint, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: ./dashboard
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: ./dashboard
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        working-directory: ./dashboard
        run: npm test

      - name: Build Vite Production Bundle
        working-directory: ./dashboard
        run: npm run build

  # ==========================================
  # 3. Mobile CI (Flutter, Analyze & Unit Tests)
  # ==========================================
  mobile-ci:
    name: Mobile (Flutter Stable, Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: ./mobile
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Unit & Widget Tests
        working-directory: ./mobile
        run: flutter test --coverage

  # ==========================================
  # 4. Unified Status Gate
  # ==========================================
  ci-status:
    name: CI Pipeline Status Check
    needs: [backend-ci, dashboard-ci, mobile-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All CI Jobs Succeeded
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "❌ Backend CI failed"
            exit 1
          fi
          if [ "${{ needs.dashboard-ci.result }}" != "success" ]; then
            echo "❌ Dashboard CI failed"
            exit 1
          fi
          if [ "${{ needs.mobile-ci.result }}" != "success" ]; then
            echo "❌ Mobile CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed successfully!"
