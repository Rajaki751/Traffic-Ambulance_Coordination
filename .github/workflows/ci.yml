name: CI Pipeline (High-Performance Bun & uv)

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================
  # 0. Changes Filter (Smart path-based conditional job execution)
  # ==============================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Path Filter Check
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  # ==============================================================
  # 1. Backend CI (FastAPI, uv Package Manager, Python Matrix)
  # ==============================================================
  backend-ci:
    name: Backend (Python ${{ matrix.python-version }} via uv)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv (High-Performance Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio pytest-cov httpx

      - name: Run Python Linters & Syntax Check
        working-directory: ./backend
        run: |
          python -m compileall app tests

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          SECRET_KEY: "ci-secret-key-for-testing-only"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          CORS_ORIGINS: "http://localhost:5173"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml -v

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ==============================================================
  # 2. Dashboard CI (React, Vite, Vitest via Bun Engine)
  # ==============================================================
  dashboard-ci:
    name: Dashboard (Bun Fast Engine - Lint, Test & Build)
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun (High-Performance JS/TS Runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies with Bun Cache
        working-directory: ./dashboard
        run: bun install

      - name: Run ESLint
        working-directory: ./dashboard
        run: bun run lint

      - name: Run TypeScript Type Check
        working-directory: ./dashboard
        run: bun x tsc --noEmit

      - name: Run Vitest Unit Tests
        working-directory: ./dashboard
        run: bun run test

      - name: Build Vite Production Bundle
        working-directory: ./dashboard
        run: bun run build

  # ==============================================================
  # 3. Mobile CI (Flutter, Analyze & Unit Tests)
  # ==============================================================
  mobile-ci:
    name: Mobile (Flutter Stable, Analyze & Test)
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: ./mobile
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Unit & Widget Tests
        working-directory: ./mobile
        run: flutter test --coverage

  # ==============================================================
  # 4. Unified Status Gate
  # ==============================================================
  ci-status:
    name: CI Pipeline Status Check
    needs: [changes, backend-ci, dashboard-ci, mobile-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Jobs Succeeded
        run: |
          if [ "${{ needs.backend-ci.result }}" == "failure" ]; then
            echo "❌ Backend CI failed"
            exit 1
          fi
          if [ "${{ needs.dashboard-ci.result }}" == "failure" ]; then
            echo "❌ Dashboard CI failed"
            exit 1
          fi
          if [ "${{ needs.mobile-ci.result }}" == "failure" ]; then
            echo "❌ Mobile CI failed"
            exit 1
          fi
          echo "✅ All required CI checks passed successfully!"
