name: Flutter Android Release

on:
  push:
    tags:
      - 'v*' # Triggers when a new tag like v1.0.0 is pushed
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build_and_release:
    name: Build APK and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create a GitHub Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact (For Manual Runs)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: sajiloroute-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
