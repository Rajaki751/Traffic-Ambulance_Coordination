name: Mobile CI/CD & Release

on:
  push:
    tags:
      - 'v*' # Trigger automatically on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

jobs:
  build-and-release:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Linter
        working-directory: ./mobile
        run: flutter analyze

      - name: Run Tests
        working-directory: ./mobile
        run: flutter test

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
