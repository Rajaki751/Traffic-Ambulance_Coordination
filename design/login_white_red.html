<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambulance coordination — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F7F5;
    --card: #FFFFFF;
    --border: #D3D1C7;
    --text: #1A1A18;
    --muted: #5F5E5A;
    --faint: #8A8880;
    --icon: #B4B2A9;
    --red: #E24B4A;
    --red-dark: #C93B3A;
    --red-pressed: #B2322F;
    --red-badge-text: #791F1F;
    --red-badge-bg: #FCEBEB;
    --red-link: #A32D2D;
    --field-bg: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
  }

  .page {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--red-badge-bg);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--red-badge-text);
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
  }

  .emblem {
    margin-top: 24px;
    width: 88px;
    height: 88px;
    border-radius: 20px;
    background: var(--red);
    display: grid;
    place-items: center;
  }

  .emblem svg { width: 40px; height: 40px; }

  h1 {
    margin-top: 24px;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--text);
    text-align: center;
  }

  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
  }

  .card {
    margin-top: 32px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(26, 26, 24, 0.04), 0 8px 24px rgba(26, 26, 24, 0.04);
  }

  .advanced-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--faint);
  }

  .advanced-toggle:hover { color: var(--muted); }

  .chevron {
    transition: transform 180ms ease;
    color: var(--faint);
  }

  .advanced-toggle[aria-expanded="true"] .chevron { transform: rotate(90deg); }

  .advanced-panel {
    display: none;
    margin-top: 16px;
  }

  .advanced-panel.open { display: block; }

  .helper {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--faint);
    padding-left: 2px;
  }

  .field-group { margin-top: 16px; }

  .field-group:first-of-type { margin-top: 20px; }

  .field-label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .field {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 12px;
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color 120ms ease;
  }

  .field:focus-within {
    border-color: var(--red);
  }

  .field svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--icon); }

  .field input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    padding: 12px 0;
  }

  .field input::placeholder { color: var(--faint); }

  .eye-btn {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    background: none;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    color: var(--icon);
    transition: color 120ms ease;
  }

  .eye-btn:hover { color: var(--muted); }

  .eye-btn svg { width: 18px; height: 18px; }

  .signin {
    margin-top: 24px;
    width: 100%;
    height: 44px;
    background: var(--red);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 120ms ease;
  }

  .signin:hover { background: var(--red-dark); }
  .signin:active { background: var(--red-pressed); }
  .signin:focus-visible { outline: 2px solid var(--red-pressed); outline-offset: 2px; }

  .footer {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .footer a {
    color: var(--red-link);
    font-weight: 500;
    text-decoration: none;
    padding: 4px 2px;
    transition: color 120ms ease;
  }

  .footer a:hover { color: var(--red); text-decoration: underline; }
  .footer a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }

  @media (max-width: 440px) {
    .shell { padding: 20px 16px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
  <main class="shell">
    <div class="page">

      <div class="badge">
        <span class="badge-dot" aria-hidden="true"></span>
        Emergency response network
      </div>

      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
          <path d="M12 4.5v15M4.5 12h15"/>
        </svg>
      </div>

      <h1>Ambulance coordination</h1>
      <p class="subtitle">Driver &amp; Traffic Officer Portal</p>

      <div class="card">
        <button
          class="advanced-toggle"
          type="button"
          id="advancedToggle"
          aria-expanded="false"
          aria-controls="advancedPanel"
        >
          Advanced settings
          <svg class="chevron" viewBox="0 0 16 16" fill="none" width="14" height="14"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4l4 4-4 4"/>
          </svg>
        </button>

        <div class="advanced-panel" id="advancedPanel" hidden>
          <div class="field-group">
            <label class="field-label" for="server">Server URL</label>
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="7" rx="2"/>
                <rect x="3" y="13" width="18" height="7" rx="2"/>
                <path d="M7 7.5h.01M7 16.5h.01"/>
              </svg>
              <input id="server" type="url" value="http://localhost:8000" autocomplete="off">
            </div>
            <p class="helper">Use your PC IP on a physical phone (same Wi-Fi)</p>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="email">Email</label>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 7l9 6 9-6"/>
            </svg>
            <input id="email" type="email" value="driver@ambulance.gov" autocomplete="username">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input id="password" type="password" value="Driver@12345" autocomplete="current-password">
            <button class="eye-btn" type="button" id="eyeBtn" aria-label="Show password" aria-pressed="false">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="signin" type="button" id="signinBtn">Sign In</button>
      </div>

      <p class="footer">
        Don't have an account?
        <a href="#" id="registerLink">Register</a>
      </p>

    </div>
  </main>

<script>
  const advancedToggle = document.getElementById('advancedToggle');
  const advancedPanel = document.getElementById('advancedPanel');
  advancedToggle.addEventListener('click', () => {
    const open = advancedPanel.classList.toggle('open');
    advancedToggle.setAttribute('aria-expanded', String(open));
    advancedPanel.hidden = !open;
  });

  const eyeBtn = document.getElementById('eyeBtn');
  const password = document.getElementById('password');
  eyeBtn.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    eyeBtn.setAttribute('aria-pressed', String(show));
  });

  const signinBtn = document.getElementById('signinBtn');
  const registerLink = document.getElementById('registerLink');
  signinBtn.addEventListener('click', (e) => e.preventDefault());
  registerLink.addEventListener('click', (e) => e.preventDefault());
</script>
</body>
</html>
