services:
  - type: web
    name: sajiloroute-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "postgresql+asyncpg://neondb_owner:npg_GVbEfjCow8u4@ep-round-rain-axjqrpdv.c-4.us-east-2.aws.neon.tech/neondb?ssl=require"
      - key: DATABASE_URL_SYNC
        value: "postgresql://neondb_owner:npg_GVbEfjCow8u4@ep-round-rain-axjqrpdv.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "Sajiloroute"
      - key: CORS_ORIGINS
        sync: false
